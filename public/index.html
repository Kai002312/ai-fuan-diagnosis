<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI時代の対応力診断</title>
<meta name="description" content="2つの質問で、あなたのAI時代への対応タイプがわかります">
<meta property="og:title" content="AI時代の対応力診断">
<meta property="og:description" content="2つの質問で、あなたのAI時代への対応タイプと、今週からできる行動がわかります">
<meta property="og:type" content="website">
<meta property="og:image" content="https://ai-saizensen.kkimura-174.workers.dev/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f1117'/%3E%3Crect x='18' y='18' width='28' height='28' rx='6' fill='%236ea8fe'/%3E%3Crect x='54' y='18' width='28' height='28' rx='6' fill='%235eead4'/%3E%3Crect x='18' y='54' width='28' height='28' rx='6' fill='%23fbbf77'/%3E%3Crect x='54' y='54' width='28' height='28' rx='6' fill='%2386efac'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #262b38;
    --text: #e8e9ed;
    --text-dim: #9aa0ae;
    --accent: #6ea8fe;
    --accent-text: #0f1117;
    --t1: #6ea8fe;
    --t2: #5eead4;
    --t3: #fbbf77;
    --t4: #86efac;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px 60px;
    min-height: 100vh;
  }
  .hero {
    margin: 0 -20px 28px;
    overflow: hidden;
  }
  .hero img {
    width: 100%;
    display: block;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 26px 22px;
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .progress-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width .3s ease;
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }
  .question {
    font-size: 17px;
    margin: 0 0 20px;
    font-weight: 700;
  }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: #1f2330;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 15px 16px;
    margin-bottom: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .choice:hover { border-color: var(--accent); background: #232838; }
  .choice:active { transform: scale(0.99); }
  .type-icons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 22px;
  }
  .type-icons span {
    display: block;
    height: 36px;
    border-radius: 8px;
  }
  .type-icons span:nth-child(1) { background: var(--t1); }
  .type-icons span:nth-child(2) { background: var(--t2); }
  .type-icons span:nth-child(3) { background: var(--t3); }
  .type-icons span:nth-child(4) { background: var(--t4); }
  .intro p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0 0 22px;
  }
  .start-btn {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .result-label {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }
  .result-title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 18px;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--type-color, var(--accent));
  }
  .result-body p {
    font-size: 15px;
    margin: 0 0 14px;
  }
  .action-box {
    background: #1f2330;
    border-left: 3px solid var(--type-color, var(--accent));
    border-radius: 4px;
    padding: 14px 16px;
    margin: 0 0 24px;
    font-size: 14px;
  }
  .action-box .label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .cta-primary {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--type-color, var(--accent));
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 17px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 10px;
  }
  .cta-primary .sub {
    display: block;
    font-size: 12px;
    font-weight: 400;
    margin-top: 3px;
    opacity: .85;
  }
  .cta-secondary {
    display: block;
    width: 100%;
    text-align: center;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    text-decoration: none;
    margin-bottom: 6px;
  }
  .cta-secondary:hover { border-color: var(--text-dim); }
  .restart {
    text-align: center;
    margin-top: 18px;
  }
  .restart a {
    color: var(--text-dim);
    font-size: 13px;
    text-decoration: underline;
  }
  footer.brand {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img src="/og-image.png" alt="AI時代の対応力診断" width="1200" height="630"></div>

  <div id="screen-intro" class="card intro">
    <div class="type-icons"><span></span><span></span><span></span><span></span></div>
    <p>2つの質問に答えるだけで、AI時代における今のあなたのタイプと、今週からできる具体的な一歩がわかります。</p>
    <button class="start-btn" onclick="goTo('q1')">診断をはじめる</button>
  </div>

  <div id="screen-q1" class="card hidden">
    <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
    <div class="progress-label">質問 1 / 2</div>
    <p class="question">この1週間で、AIに関するニュースや話題を目にした回数は?</p>
    <button class="choice" onclick="answerQ1('A')">3回以上あり、内容も覚えている</button>
    <button class="choice" onclick="answerQ1('B')">1〜2回程度、内容はあまり覚えていない</button>
  </div>

  <div id="screen-q2" class="card hidden">
    <div class="progress-track"><div class="progress-fill" style="width:50%"></div></div>
    <div class="progress-label">質問 2 / 2</div>
    <p class="question">AIツールを、実際に自分で触ってみたことは?</p>
    <button class="choice" onclick="showResult('type1')">ある(使ってみた・試したことがある)</button>
    <button class="choice" onclick="showResult('type2')">まだない(情報を見ているだけ)</button>
  </div>

  <div id="screen-q3" class="card hidden">
    <div class="progress-track"><div class="progress-fill" style="width:50%"></div></div>
    <div class="progress-label">質問 2 / 2</div>
    <p class="question">AIの話題を見聞きしたとき、正直な気持ちに近いのは?</p>
    <button class="choice" onclick="showResult('type3')">このままで大丈夫か、少し気になる</button>
    <button class="choice" onclick="showResult('type4')">特に気にならない、自分にはまだ関係ない気がする</button>
  </div>

  <div id="screen-result" class="card hidden">
    <div class="result-label">あなたのタイプ</div>
    <h2 id="result-title" class="result-title"></h2>
    <div id="result-body" class="result-body"></div>
    <div class="action-box">
      <div class="label">今日からできること</div>
      <div id="result-action"></div>
    </div>
    <a id="cta-buy" class="cta-primary" href="https://note.com/ai_saizensen_jp/n/ne9dc657b610b" target="_blank" rel="noopener">
      タイプ別・4週間行動プランを見る
      <span class="sub">note記事(980円) / プロンプト集・チェックリストつき</span>
    </a>
    <a id="cta-share" class="cta-secondary" href="#" target="_blank" rel="noopener">この結果をXでシェアする</a>
    <div class="restart"><a href="#" onclick="location.reload(); return false;">もう一度診断する</a></div>
  </div>

  <footer class="brand">AIの最前線</footer>
</div>

<script>
  // Google広告のクリック経由だと、URLに ?gclid=... が自動で付く(オークションタグ設定)。
  // ページ内で完結する診断なので、読み込み時に一度だけ拾って結果送信時に一緒に送る。
  const gclid = new URLSearchParams(window.location.search).get('gclid') || '';

  const RESULTS = {
    type1: {
      title: "準備万端タイプ",
      color: "var(--t1)",
      body: "<p>あなたは、AIの情報を集めるだけでなく、実際に手を動かして試している数少ないタイプです。多くの人が「情報を集めるだけ」で止まる中、あなたはすでに一歩先にいます。</p>",
      action: "今使っているAIツールで、まだ試していない機能を1つだけ触ってみてください。それだけで、来週の自分が少し変わります。"
    },
    type2: {
      title: "知識先行・実践不足タイプ",
      color: "var(--t2)",
      body: "<p>情報はしっかり集められていて、知識量としてはすでに十分です。足りないのは知識ではなく、ほんの小さな「試す」の一歩だけです。</p>",
      action: "知っているAIツールを1つだけ開いて、何か1つ入力してみてください。完璧である必要はありません。「触った」という事実が、来週のあなたを変えます。"
    },
    type3: {
      title: "情報不足・不安先行タイプ",
      color: "var(--t3)",
      body: "<p>「追いつけていない」という感覚、実は多くの人が同じように感じています。あなただけが遅れているわけではありません。不安の正体の多くは、単に情報との接触量が少ないことです。</p>",
      action: "信頼できる情報源を1つだけ決めて、フォローしてみてください。何十個も追う必要はありません。1つで十分です。"
    },
    type4: {
      title: "楽観マイペースタイプ",
      color: "var(--t4)",
      body: "<p>AIの変化に対して、今のところ大きな不安を感じていないあなたは、目の前のことに集中できている強さを持っています。焦って情報を詰め込む必要はありません。</p>",
      action: "自分の仕事や興味のある分野で、AIが話題になっているニュースを1つだけ探してみてください。それだけで十分な一歩です。"
    }
  };

  function goTo(id) {
    document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
    document.getElementById('screen-' + id).classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function answerQ1(choice) {
    goTo(choice === 'A' ? 'q2' : 'q3');
  }

  function showResult(typeKey) {
    // 計測が失敗しても診断表示は絶対に止めたくないので、結果への影響を一切与えない形で送る。
    fetch('/api/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: typeKey, gclid })
    }).catch(() => {});

    const r = RESULTS[typeKey];
    const resultCard = document.getElementById('screen-result');
    resultCard.style.setProperty('--type-color', r.color);
    document.getElementById('result-title').textContent = r.title;
    document.getElementById('result-body').innerHTML = r.body;
    document.getElementById('result-action').textContent = r.action;

    const shareText = encodeURIComponent(
      "「AI時代の対応力診断」を受けたら" + r.title + "でした。今週からできることが具体的にわかった。"
    );
    const shareUrl = encodeURIComponent(window.location.href);
    document.getElementById('cta-share').href =
      "https://twitter.com/intent/tweet?text=" + shareText + "&url=" + shareUrl;

    goTo('result');
  }
</script>
</body>
</html>
